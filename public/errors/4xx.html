<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veda Service — ошибка запроса</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #ffffff; color: #111111; text-align: center; padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #121212; color: #f3f3f3; }
    p { color: #a3a3a3 !important; }
  }
  .brand { color: #a21500; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
  @media (prefers-color-scheme: dark) { .brand { color: #ff5c42; } }
  h1 { font-size: 22px; font-weight: 700; }
  p { color: #747474; font-size: 14px; line-height: 1.5; max-width: 380px; }
  a { color: #a21500; }
  .fade { animation: rise .45s cubic-bezier(0,0,.2,1) both; }
  .fade:nth-child(2) { animation-delay: .08s } .fade:nth-child(3) { animation-delay: .16s }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
</style>
</head>
<body>
  <span class="brand fade">Veda Service</span>
  <h1 class="fade">Не получилось обработать запрос</h1>
  <p class="fade">Проверьте адрес и попробуйте ещё раз — <a href="/">вернуться в кабинет</a>.<br>The request couldn't be processed — please go back and retry.</p>
</body>
</html>
