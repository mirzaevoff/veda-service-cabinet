<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veda Service — технические работы</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #ffffff; color: #111111; text-align: center; padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #121212; color: #f3f3f3; }
    p { color: #a3a3a3 !important; }
  }
  .brand { color: #a21500; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
  @media (prefers-color-scheme: dark) { .brand { color: #ff5c42; } }
  .pad {
    width: 56px; height: 56px; border-radius: 16px; background: #ffe8e5;
    display: flex; align-items: center; justify-content: center; margin-bottom: 6px;
    animation: pulse 2.5s ease-in-out infinite;
  }
  @media (prefers-color-scheme: dark) { .pad { background: #3a130b; } }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  p { color: #747474; font-size: 14px; line-height: 1.5; max-width: 380px; }
  .fade { animation: rise .45s cubic-bezier(0,0,.2,1) both; }
  .fade:nth-child(2) { animation-delay: .08s } .fade:nth-child(3) { animation-delay: .16s }
  .fade:nth-child(4) { animation-delay: .24s }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
</style>
</head>
<body>
  <div class="pad fade">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a21500" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a5 5 0 0 0-7.07 7.07l-4.1 4.1a1.5 1.5 0 0 0 2.12 2.12l4.1-4.1a5 5 0 0 0 7.07-7.07l-2.83 2.83-2.12-2.12 2.83-2.83Z"/>
    </svg>
  </div>
  <span class="brand fade">Veda Service</span>
  <h1 class="fade">Технические работы</h1>
  <p class="fade">Кабинет обновляется и скоро вернётся. Обновите страницу через пару минут.<br>We're updating the service — please retry in a couple of minutes.</p>
</body>
</html>
